services:
  # ─────────────────────────────────────────────
  # PostgreSQL — primary relational database
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: science-fit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sciencefit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sciencefit_dev}
      POSTGRES_DB: ${POSTGRES_DB:-sciencefit}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sciencefit}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Qdrant — vector database for RAG
  # ─────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: science-fit-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  qdrant_data:
