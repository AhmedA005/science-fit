services:
  # ─────────────────────────────────────────────
  # PostgreSQL — primary relational database
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: science-fit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sciencefit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sciencefit_dev}
      POSTGRES_DB: ${POSTGRES_DB:-sciencefit}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sciencefit}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Qdrant — vector database for RAG
  # ─────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: science-fit-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:6333/healthz')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ─────────────────────────────────────────────
  # Science-Fit Application
  # ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: science-fit-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-sciencefit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sciencefit_dev}
      POSTGRES_DB: ${POSTGRES_DB:-sciencefit}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-fitness_evidence}
      OLLAMA_HOST: https://ollama.com
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-gemma4:31b-cloud}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      APP_ENV: development
      APP_DEBUG: "true"
      LOG_LEVEL: INFO
      API_HOST: 0.0.0.0
      API_PORT: 8000
      KNOWLEDGE_BASE_DIR: knowledge
      TRAINING_CONFIG_PATH: config/training_config.yaml
      NUTRITION_CONFIG_PATH: config/nutrition_config.yaml
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src/ui:/app/src/ui
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
      "

volumes:
  postgres_data:
  qdrant_data:
