[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "science-fit"
version = "0.1.0"
description = "AI Personal Trainer & Nutrition Coach — evidence-based fitness assistant"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",          # async PostgreSQL driver
    "psycopg2-binary>=2.9",   # sync driver for Alembic migrations

    # Config & validation
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",

    # LLM & agent
    "langchain>=0.3",
    "langchain-ollama>=0.2",   # Ollama integration for LangChain
    "langgraph>=0.2",
    "ollama>=0.3",             # Ollama Python client (used directly for embeddings)

    # Vector database
    "qdrant-client[fastembed]>=1.9",

    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",

    # MCP
    "fastmcp>=2.0",

    # UI
    "streamlit>=1.36",

    # Data processing (seed scripts)
    "pandas>=2.2",
    "requests>=2.32",

    # Utilities
    "rich>=13",               # pretty console output in seed scripts
    "typer>=0.12",            # CLI for seed scripts
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx>=0.27",            # for FastAPI test client
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]
